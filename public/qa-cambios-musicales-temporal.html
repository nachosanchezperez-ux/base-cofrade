<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>QA temporal · Cambios musicales</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: #172c40;
        background: #e8edf2;
        font-family: system-ui, sans-serif;
      }
      header {
        padding: 12px 24px;
        border-bottom: 1px solid #cbd5df;
        background: #fff;
      }
      .controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
      h1 {
        margin: 0 12px 0 0;
        font-size: 18px;
        line-height: 1.3;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 650;
      }
      select, button {
        min-height: 44px;
        border: 1px solid #b8c6d3;
        border-radius: 6px;
        padding: 8px 12px;
        color: #172c40;
        background: #fff;
        font: inherit;
        font-size: 15px;
      }
      button { cursor: pointer; }
      button:hover { background: #eef3f7; }
      :focus-visible { outline: 3px solid #267cbf; outline-offset: 2px; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; }
      p {
        margin: 8px 0 0;
        color: #566779;
        font-size: 13px;
        line-height: 1.4;
      }
      .stage { padding: 18px 24px 24px; overflow: auto; }
      iframe {
        display: block;
        margin-inline: auto;
        border: 0;
        background: #fff;
        box-shadow: 0 0 0 1px #bcc9d5, 0 8px 28px rgb(23 44 64 / 12%);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="controls">
        <h1>QA temporal · Cambios musicales</h1>
        <label for="preview-width">Anchura
          <select id="preview-width" aria-label="Anchura de la página en píxeles">
            <option value="320">320 px</option>
            <option value="390" selected>390 px</option>
            <option value="430">430 px</option>
            <option value="768">768 px</option>
            <option value="1024">1024 px</option>
            <option value="1200">1200 px</option>
          </select>
        </label>
        <nav aria-label="Casos de revisión">
          <button type="button" data-path="/semana-santa/2027/cambios-musicales">Inicio</button>
          <button type="button" data-path="/semana-santa/2027/cambios-musicales#jornada-madruga">Madrugá</button>
          <button type="button" data-path="/semana-santa/2027/cambios-musicales#cambio-15c7978e-ca6e-4f0b-b951-c7745fdc60d0">Calle Real</button>
          <button type="button" data-path="/semana-santa/2027/cambios-musicales#cambio-a9583483-67ea-4c36-b3fe-78f776e99649">Trinidad</button>
        </nav>
      </div>
      <p>La página real se muestra con una anchura controlada. Esta prueba revisa el diseño responsive; no emula un teléfono físico ni otro navegador.</p>
    </header>
    <main class="stage">
      <iframe
        id="music-preview"
        name="music-preview"
        title="Cambios musicales · Página real de la preview"
        width="390"
        height="760"
        src="/semana-santa/2027/cambios-musicales#jornada-madruga"
      ></iframe>
    </main>
    <script>
      const musicFrame = document.getElementById('music-preview');
      const allowedWidths = new Set(['320', '390', '430', '768', '1024', '1200']);
      document.getElementById('preview-width').addEventListener('change', (event) => {
        if (allowedWidths.has(event.target.value)) musicFrame.width = event.target.value;
      });
      document.querySelectorAll('button[data-path]').forEach((button) => {
        button.addEventListener('click', () => {
          musicFrame.src = button.dataset.path;
        });
      });
    </script>
  </body>
</html>
