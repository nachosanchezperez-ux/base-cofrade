<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión responsive de acompañamientos</title>
<style>
body{margin:0;background:#e8edf2;font:16px system-ui;color:#112339}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:9px;min-height:44px}label{display:flex;gap:6px;align-items:center}iframe{display:block;border:1px solid #aabbcc;background:white;width:390px;height:1000px;margin:0 auto;max-width:none}output{font-size:14px}main{overflow:auto;padding:0 12px 20px}
</style>
<header>
<label>Anchura<select id="width"><option>320</option><option selected>390</option><option>430</option><option>768</option><option>1024</option><option>1200</option></select></label>
<label>Vista<select id="view"><option value="/acompanamientos-musicales?temporada=2027&q=Santa+Ana">Santa Ana · 2027</option><option value="/acompanamientos-musicales?temporada=2026&q=Cigarreras">Las Cigarreras · 2026</option><option value="/acompanamientos-musicales">Todas · 2026</option><option value="/acompanamientos-musicales?temporada=2027">Todas · 2027</option></select></label>
<button id="measure">Medir</button><output id="metrics" aria-live="polite"></output>
</header>
<main><iframe id="preview" title="Vista responsive de acompañamientos" src="/acompanamientos-musicales?temporada=2027&q=Santa+Ana"></iframe></main>
<script>
const frame=document.getElementById('preview');
document.getElementById('width').addEventListener('change',e=>{frame.style.width=e.target.value+'px';});
document.getElementById('view').addEventListener('change',e=>{frame.src=e.target.value;});
document.getElementById('measure').addEventListener('click',()=>{
 const doc=frame.contentDocument;
 const win=frame.contentWindow;
 const root=doc.documentElement;
 const controls=[...doc.querySelectorAll('form input,form select,form button')];
 const headings=[...doc.querySelectorAll('table h3')];
 const result={width:win.innerWidth,scrollWidth:root.scrollWidth,overflow:Math.max(0,root.scrollWidth-win.innerWidth),controlMinHeight:Math.min(...controls.map(el=>el.getBoundingClientRect().height)),controlMinFont:Math.min(...controls.map(el=>parseFloat(win.getComputedStyle(el).fontSize))),bandMinFont:Math.min(...headings.map(el=>parseFloat(win.getComputedStyle(el).fontSize)))};
 document.getElementById('metrics').textContent=JSON.stringify(result);
});
</script>
</html>
