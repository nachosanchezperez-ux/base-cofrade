name: Rebuild Pastora media

on:
  push:
    branches:
      - fix/pastora-cantillana-webp-validos
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pastora-cantillana-webp-validos
      - name: Rebuild valid WebP
        shell: bash
        run: |
          cat .hilo-temp/pastora.part00 \
              .hilo-temp/pastora.part01 \
              .hilo-temp/pastora.part02 \
              .hilo-temp/pastora.part03 \
              .hilo-temp/pastora.part04a \
            | base64 -d > public/hermandades/pastora-de-cantillana/divina-pastora-de-las-almas.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('public/hermandades/pastora-de-cantillana/divina-pastora-de-las-almas.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', 'invalid WebP'
          print(f'{p}: {len(b)} bytes, valid WebP')
          PY
      - name: Clean staging files
        run: rm -rf .hilo-temp .github/workflows/hilo-rebuild-pastora-media.yml
      - name: Commit fixed image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige WebP de la Divina Pastora de Cantillana'
          git push
