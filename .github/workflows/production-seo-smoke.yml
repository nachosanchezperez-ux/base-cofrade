name: Production SEO Smoke

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  group: production-seo-smoke
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && contains(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verifica superficies SEO públicas
        run: node scripts/public-seo-smoke.mjs
