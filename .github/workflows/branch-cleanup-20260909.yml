name: One-shot branch cleanup 2026-09-09

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/branch-cleanup-20260909.yml
      - docs/BRANCH-CLEANUP-CANDIDATES-2026-09-09.csv
      - scripts/cleanup-remote-branches.mjs

permissions:
  contents: write

concurrency:
  group: one-shot-branch-cleanup-20260909
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'nachosanchezperez-ux/base-cofrade'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Elimina solo las referencias exactas auditadas
        run: >-
          node scripts/cleanup-remote-branches.mjs
          --execute
          --expected-count=753
          --manifest=docs/BRANCH-CLEANUP-CANDIDATES-2026-09-09.csv
          --recovery-ref=archive/pre-cleanup-20260909
          --recovery-sha=1261c3d1d7da023faa0449ed2cd2b69fef7fabe1
