name: Sync San Benito crest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-san-benito-crest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download official crest
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --user-agent 'Hilo Cofrade asset sync' \
            'https://hermandaddesanbenito.net/wp-content/uploads/2022/12/escudo-transparente-284x300.png' \
            --output public/escudos/san-benito.png
          test "$(wc -c < public/escudos/san-benito.png)" -gt 10000
          file public/escudos/san-benito.png | grep -q 'PNG image data, 284 x 300'
      - name: Commit local crest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/escudos/san-benito.png
          git diff --cached --quiet && exit 0
          git commit -m 'Sustituye el escudo de San Benito por el recurso oficial'
          git push origin HEAD:main
